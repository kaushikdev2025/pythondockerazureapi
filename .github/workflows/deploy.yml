name: Build and Deploy to Azure Container Apps

on:
  push:
    branches:
      - main  # Triggers the workflow on push to the main branch

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Log into your Azure Account using the saved secret
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 3: Build Docker Image, Push to ACR, and Deploy to Container App
      - name: Build and Deploy Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: 'acrkd1oct026'          # Just the name, not the .azurecr.io suffix
          containerAppName: 'contapp1oct2026' # The target Azure Container App name
          resourceGroup: 'rgp-1oct2026'   # The target Azure Resource Group